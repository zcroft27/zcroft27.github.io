<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=49">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Travels</title>
    <script>document.documentElement.classList.add("js-wait");setTimeout(function(){document.documentElement.classList.add("js-ready");},2500);</script>
    <style>
        .travels-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 32px 150px;
        }
        .trip { margin-bottom: 48px; }
        .trip-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .trip-name {
            color: var(--ink);
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0;
        }
        .trip-places {
            color: var(--muted);
            font-size: 14px;
        }
        .trip-blurb {
            color: var(--muted);
            font-size: 15px;
            margin: -6px 0 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 560px) {
            .grid { grid-template-columns: 1fr; }
        }
        .tile {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: var(--fill);
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.24s ease, border-color 0.24s ease;
        }
        .tile:hover {
            transform: translateY(-3px);
            border-color: var(--line-strong);
        }
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(0.12);
            transition: transform 0.4s ease, filter 0.3s ease;
        }
        .tile:hover img { filter: grayscale(0); transform: scale(1.03); }
        .tile .cap {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff;
            font-size: 12px;
            padding: 24px 12px 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .tile:hover .cap { opacity: 1; }
        .tile.placeholder {
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: none;
            border: 1px dashed var(--line-strong);
        }
        .tile.placeholder:hover { transform: none; box-shadow: none; }
        .ph-inner { color: var(--muted); font-size: 12px; padding: 10px; line-height: 1.5; }
        .ph-inner i { font-size: 22px; display: block; margin-bottom: 8px; color: var(--line-strong); }
        .ph-inner code { color: var(--muted); font-size: 11px; }
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(28, 28, 30, 0.82);
            backdrop-filter: blur(6px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
        }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 92vw; max-height: 82vh; border-radius: 12px; }
        #lightbox .lb-cap {
            color: #fff;
            font-size: 14px;
            margin-top: 16px;
            min-height: 18px;
        }
        #lightbox .lb-close {
            position: absolute;
            top: 20px;
            right: 26px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            line-height: 1;
        }
        #lightbox .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.16s ease;
        }
        #lightbox .lb-nav:hover { background: rgba(255, 255, 255, 0.3); }
        #lightbox .lb-prev { left: 20px; }
        #lightbox .lb-next { right: 20px; }
        #lightbox .lb-count {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Hand-inked "odd squiggle" vocabulary, stamped with <use> in the scenes
         below. The paths are drawn deliberately off-true — control points
         nudged out of symmetry, arcs that don't quite match their neighbours —
         so the lines wobble like brushwork instead of reading as generated
         geometry. Children that need filling say so on themselves; everything
         else inherits fill/stroke from the .art-squig host. -->
    <svg class="svg-defs" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="sq-arch" viewBox="0 0 100 72">
                <path d="M5 68C6 31 27 8 50 7c24-1 44 22 45 61"/>
                <path d="M17 68C18 39 32 20 50 19c19-1 34 20 34 49"/>
                <path d="M29 68c1-21 8-36 21-36.5C63 31 71 46 71.5 68"/>
                <path d="M41 68c.5-13 3-24 9-24.5C56 43 59 55 59.5 68"/>
            </symbol>
            <symbol id="sq-zigzag" viewBox="0 0 100 62">
                <path d="M4 26 17 6 27 27 40 5 51 26 64 6 74 27 87 5 96 22"/>
                <path d="M6 56 17 38 29 57 41 36 52 56 65 37 75 57 88 36 97 52"/>
            </symbol>
            <symbol id="sq-wave" viewBox="0 0 100 56">
                <path d="M4 12c8-9 14 8 22 0s14 9 22 1 14 8 22 0c4-4 6-2 8 0"/>
                <path d="M5 30c8-10 14 8 22 0s14 9 22 1 14 8 22-1c4-4 6-1 8 1"/>
                <path d="M4 48c8-9 14 8 22 0s14 9 22 1 14 8 22 0c4-4 6-2 8 1"/>
            </symbol>
            <symbol id="sq-stripes" viewBox="0 0 100 70">
                <path d="M8 8c22-2 46-1 81 1" stroke-width="3.2"/>
                <path d="M4 21c26-3 51 0 88 2" stroke-width="2"/>
                <path d="M11 34c20-1 44 1 77-1" stroke-width="3.6"/>
                <path d="M6 47c24 2 53-2 84 0" stroke-width="2.2"/>
                <path d="M13 60c18-2 41 1 71 1" stroke-width="3"/>
            </symbol>
            <symbol id="sq-vbars" viewBox="0 0 80 100">
                <path d="M7 6c-2 28-1 60 1 88"/>
                <path d="M20 9c2 26 0 58-1 84"/>
                <path d="M33 5c-1 30 1 62 0 90" stroke-width="3.2"/>
                <path d="M46 8c2 28-1 56 1 86"/>
                <path d="M59 6c-2 26 1 60-1 88" stroke-width="3.2"/>
                <path d="M72 10c1 28 0 54-1 82"/>
            </symbol>
            <symbol id="sq-spiral" viewBox="0 0 100 100">
                <path d="M50 7c24 0 43 19 43 43 0 23-19 42-44 42-23 0-40-17-40-40 0-21 16-36 37-36 18 0 32 13 32 31 0 15-12 27-28 27-13 0-23-10-23-24 0-11 9-20 21-20 10 0 17 8 17 18 0 8-6 14-14 14"/>
            </symbol>
            <symbol id="sq-loops" viewBox="0 0 100 92">
                <path d="M42 5c19-2 34 15 35 35 1 21-12 40-31 41C27 82 11 65 10 45 9 25 23 7 42 5Z"/>
                <path d="M64 12c17-1 27 17 28 34 1 20-10 37-27 38-18 1-29-17-30-36-1-18 10-35 29-36Z"/>
            </symbol>
            <symbol id="sq-rings" viewBox="0 0 100 72">
                <path d="M18 8c8 0 13 4 13 9.5S25 27 17 27 5 22 5 17.5 10 8 18 8Z"/>
                <path d="M51 5c7-1 11 4 11 8.5S57 22 50 22s-11-4-11-8.5S44 6 51 5Z"/>
                <path d="M83 10c8 0 12 5 12 10s-5 9-13 9-11-5-11-9.5S75 10 83 10Z"/>
                <path d="M26 42c8-1 12 4 12 8.5S33 59 25 59s-11-4-11-8 4-8 12-9Z"/>
                <path d="M61 42c9 0 14 5 14 10.5S69 63 60 63s-13-5-13-10 5-11 14-11Z"/>
                <path d="M91 40c6 0 9 4 9 7.5S96 55 90 55s-9-3-9-7 4-8 10-8Z"/>
            </symbol>
            <symbol id="sq-speckle" viewBox="0 0 100 100">
                <g stroke-width="5">
                    <path d="M11 13l5 6"/><path d="M33 8l6 4"/><path d="M56 14l4 6"/><path d="M79 9l6 5"/>
                    <path d="M20 32l6 5"/><path d="M44 29l4 6"/><path d="M67 34l6 4"/><path d="M88 30l4 6"/>
                    <path d="M9 52l6 5"/><path d="M32 55l4 5"/><path d="M55 50l6 5"/><path d="M78 55l5 5"/>
                    <path d="M19 74l5 6"/><path d="M42 78l6 4"/><path d="M65 73l4 6"/><path d="M87 77l6 5"/>
                    <path d="M30 94l5 4"/><path d="M62 92l5 5"/>
                </g>
            </symbol>
            <symbol id="sq-moon" viewBox="0 0 100 58">
                <path fill="currentColor" stroke="none"
                      d="M19 3c14 1 25 13 25 26 0 14-11 26-26 26-1 0-2-1-2-2V5c0-1 1-2 3-2Z"/>
                <path fill="currentColor" stroke="none"
                      d="M58 5c15 0 28 12 28 25S73 55 58 55c-2 0-3-1-3-2V7c0-1 1-2 3-2Z"/>
            </symbol>
            <symbol id="sq-sparkle" viewBox="0 0 100 100">
                <path fill="currentColor" stroke="none"
                      d="M50 2c4 31 16 44 47 47-30 4-44 17-47 49-4-31-17-44-48-48 31-4 44-17 48-48Z"/>
            </symbol>
            <symbol id="sq-scribble" viewBox="0 0 100 64">
                <path d="M6 40c-3-12 8-22 18-16s6 24 17 26 18-14 12-24S37 12 44 6s21 4 24 15-8 22 0 28 20-3 25-13"/>
            </symbol>
        </defs>
    </svg>
    <!-- This page's content column is 1000px, so the gutters are narrow —
         everything here stays small and hugs the edge. -->
    <div class="art-scene" aria-hidden="true">
        <!-- left gutter -->
        <!-- Sits just under the back link, so its drift and mouse lean point
             down and away from it rather than up into it. -->
        <div class="art" style="--top:11.0%; --left:3.4%; --w:64px; --h:74px" data-depth="0.1246" data-mouse="9.2" data-mouse-y="4">
            <div class="art-i" style="--dur:26s; --dx:7px; --dy:9px; --rot:2deg; --op:.60"><div class="art-cut art-cut--ink cut-globe" style="--tilt:-7deg; --ink:var(--collage-teal)"></div></div>
        </div>
        <div class="art" style="--top:30.0%; --left:1.7%; --w:82px; --h:48px" data-depth="0.1132" data-mouse="-11.1" data-mouse-y="5.3">
            <div class="art-i" style="--dur:25s; --dx:6px; --dy:-10px; --rot:4deg; --op:.30"><svg class="art-squig" style="--sw:2.4; --tilt:4deg"><use href="#sq-wave"/></svg></div>
        </div>
        <div class="art" style="--top:52.0%; --left:1.1%; --w:62px; --h:106px" data-depth="0.1475" data-mouse="6.8" data-mouse-y="14.7">
            <div class="art-i" style="--dur:24s; --dx:6px; --dy:-12px; --rot:3deg; --op:.62"><div class="art-cut art-cut--ink cut-lobster" style="--tilt:6deg; --ink:var(--collage-red)"></div></div>
        </div>
        <div class="art" style="--top:78.0%; --left:4.4%; --size:54px" data-depth="0.0965" data-mouse="7.9" data-mouse-y="7.9">
            <div class="art-i" style="--dur:22s; --dx:7px; --dy:-11px; --rot:5deg; --op:.26"><svg class="art-squig" style="--tilt:-5deg"><use href="#sq-speckle"/></svg></div>
        </div>

        <!-- right gutter -->
        <div class="art" style="--top:15.0%; --left:92.6%; --w:68px; --h:49px; color:var(--collage-red)" data-depth="0.1037" data-mouse="10.5" data-mouse-y="5.0">
            <div class="art-i" style="--dur:28s; --dx:-7px; --dy:10px; --rot:-4deg; --op:.36"><svg class="art-squig" style="--sw:3; --tilt:-4deg"><use href="#sq-arch"/></svg></div>
        </div>
        <div class="art" style="--top:36.0%; --left:91.0%; --w:70px; --h:94px" data-depth="0.1484" data-mouse="6.8" data-mouse-y="14.7">
            <div class="art-i" style="--dur:27s; --dx:-6px; --dy:-10px; --rot:4deg; --op:.55"><div class="art-cut cut-pine" style="--tilt:8deg"></div></div>
        </div>
        <div class="art" style="--top:62.0%; --left:91.8%; --size:74px; color:var(--collage-teal)" data-depth="0.1344" data-mouse="9.6" data-mouse-y="9.6">
            <div class="art-i" style="--dur:26s; --dx:-7px; --dy:11px; --rot:-4deg; --op:.34"><svg class="art-squig" style="--sw:2.8; --tilt:5deg"><use href="#sq-loops"/></svg></div>
        </div>
        <div class="art" style="--top:88.0%; --left:95.6%; --size:22px; color:var(--collage-mustard)" data-depth="0.04" data-mouse="-3.6" data-mouse-y="3.6">
            <div class="art-i" style="--dur:21s; --dx:-5px; --dy:-8px; --rot:7deg; --op:.48"><svg class="art-squig"><use href="#sq-sparkle"/></svg></div>
        </div>
    </div>
    <a href="/" class="home-link"><i class="fas fa-arrow-left"></i> Home</a>
    <div class="travels-wrap">
        <p class="eyebrow reveal">Film &amp; feet</p>
        <h1 class="page-title reveal" style="--d: 80ms">Travels</h1>
        <p class="page-intro reveal" style="--d: 160ms">A few favorite shots.</p>

        <div id="gallery" class="reveal" style="--d: 240ms"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <button class="lb-nav lb-prev" aria-label="Previous photo" onclick="lbNav(event,-1)">&#8249;</button>
        <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
        <button class="lb-nav lb-next" aria-label="Next photo" onclick="lbNav(event,1)">&#8250;</button>
        <div class="lb-cap" id="lb-cap"></div>
        <div class="lb-count" id="lb-count"></div>
    </div>

    <script>
    const trips = [
        { id: "italy", name: "Italy", emoji: "🇮🇹", places: "Rome, Florence, San Gimignano", blurb: "Currently learning to speak Italian. Daje Roma!", photos: ["1.jpg", "2.jpg"] },
        { id: "switzerland", name: "Switzerland", emoji: "🇨🇭", places: "Zurich, Lucerne, Lauterbrunnen", blurb: "", photos: [{ file: "cow.png", caption: "Lauterbrunnen, Switzerland" }, "1.jpg", "2.jpg"] },
        { id: "cape-cod", name: "Cape Cod", emoji: "🏖️", places: "Summers on the Cape", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "pacific-northwest", name: "Pacific Northwest", emoji: "🌲", places: "Vancouver, Vancouver Island", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "new-york-city", name: "New York City", emoji: "🗽", places: "NYC", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "puerto-rico", name: "Puerto Rico", emoji: "🌴", places: "San Juan", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "south-africa", name: "South Africa", emoji: "🦓", places: "Orchestra tour", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "trumpet", name: "Trumpet", emoji: "🎺", places: "Music", blurb: "", photos: ["1.jpg", "2.jpg"] },
        { id: "climbing", name: "Rock climbing", emoji: "🧗", places: "", blurb: "", photos: ["1.jpg", "2.jpg"] }
    ];

    let lbGroup = [];
    let lbIndex = 0;

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => (
            {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
        ));
    }

    function photoParts(trip, p) {
        const file = typeof p === "string" ? p : p.file;
        const caption = typeof p === "string" ? "" : (p.caption || "");
        return { src: "photos/" + trip.id + "/" + file, caption: caption };
    }

    function render() {
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = trips.map(trip => {
            const tiles = trip.photos.map((p, idx) => {
                const { src, caption } = photoParts(trip, p);
                const file = src.split("/").pop();
                const capHtml = caption ? '<div class="cap">' + esc(caption) + '</div>' : "";
                const ph = '<div class=\'ph-inner\'><i class=\'fas fa-camera\'></i>add <code>photos/'
                    + esc(trip.id) + "/" + esc(file) + '</code></div>';
                return '<div class="tile" '
                    + 'onclick="openLightbox(\'' + esc(trip.id) + '\',' + idx + ')">'
                    + '<img src="' + esc(src) + '" alt="' + esc(caption) + '" '
                    + 'onerror="this.parentNode.classList.add(\'placeholder\');'
                    + 'this.parentNode.onclick=null;'
                    + 'this.parentNode.innerHTML=\'' + ph.replace(/'/g, "\\'") + '\';">'
                    + capHtml
                    + '</div>';
            }).join("");
            const blurb = trip.blurb ? '<p class="trip-blurb">' + esc(trip.blurb) + '</p>' : "";
            return '<section class="trip" data-reveal>'
                + '<div class="trip-head">'
                + '<span class="trip-name">' + esc(trip.name) + ' ' + trip.emoji + '</span>'
                + '<span class="trip-places">' + esc(trip.places) + '</span>'
                + '</div>'
                + blurb
                + '<div class="grid">' + tiles + '</div>'
                + '</section>';
        }).join("");
    }

    function openLightbox(tripId, idx) {
        const trip = trips.find(t => t.id === tripId);
        lbGroup = trip.photos.map(p => photoParts(trip, p));
        lbIndex = idx;
        showLb();
        document.getElementById("lightbox").classList.add("open");
    }
    function showLb() {
        const cur = lbGroup[lbIndex];
        document.getElementById("lb-img").src = cur.src;
        document.getElementById("lb-cap").textContent = cur.caption || "";
        const multi = lbGroup.length > 1;
        document.getElementById("lb-count").textContent = multi ? (lbIndex + 1) + " / " + lbGroup.length : "";
        document.querySelector(".lb-prev").style.display = multi ? "flex" : "none";
        document.querySelector(".lb-next").style.display = multi ? "flex" : "none";
    }
    function lbNav(e, dir) {
        e.stopPropagation();
        const n = lbGroup.length;
        lbIndex = (lbIndex + dir + n) % n;
        showLb();
    }
    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
    }
    document.addEventListener("keydown", e => {
        if (!document.getElementById("lightbox").classList.contains("open")) return;
        if (e.key === "Escape") closeLightbox();
        else if (e.key === "ArrowLeft") lbNav(e, -1);
        else if (e.key === "ArrowRight") lbNav(e, 1);
    });

    render();
    </script>
    <script src="decor.js?v=47" defer></script>
</body>
</html>
