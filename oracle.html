# Oracle and Take-home Challenges

A Go server Stone Liu and I co-built for Generate's SWE take-homes. Candidates register, get per-user challenge data from an oracle API, and (for algorithm tracks) submit answers for scoring. Score `0` is optimal, higher is worse, `-1` is invalid.

We ran two themes on mostly the same stack: [2025 — alien invasions](https://github.com/stoneliuCS/generate_technical_2025) and [2026 — a bank / museum heist](https://github.com/zcroft27/generate_technical_spring_2026). Both use OpenAPI (fluid-oas → ogen handlers), Postgres, Docker testcontainers, Task, and Bun. Specs live on a templ page; Slack middleware pings on panics and slow requests.

## Spring 2025 — Alien invasions

Three challenges; backend was split into an easier Track 1 and a harder Track 2.

**Track 1 (ngrok).** Build a small aliens CRUD API (healthcheck, bulk POST, filtered GET, DELETE), expose it with ngrok, and submit the public URL. The oracle hits healthcheck, clears state, POSTs a user-id–seeded alien set, then runs several filter GETs and diffs the response against the expected set.

**Track 2 (algorithm).** Defend a fortress: aliens have ATK/HP, the wall has HP, and each turn you pick `volley`, `focusedVolley`, or `focusedShot`. Submit command sequences; the oracle simulates yours and compares remaining HP / aliens left to its own solution.

**Frontend.** Match a [Figma dashboard](https://www.figma.com/design/reKpbILCizcrTjnrBn6hzU/Generate-Coding-Challenge?node-id=1071-381) for tracking invaders. The oracle serves a batch of detailed aliens for the client to hold and manipulate.

That run stayed up ~10 days, graded 3,600+ submissions from 55+ candidates, and only hit two runtime errors (patched within minutes off Slack).

## Spring 2026 — Bank heist

Candidates pick **either** the algorithm challenge **or** the frontend — not both. Co-created with [Stone Liu](https://stoneliucs.github.io/).

**Algorithm — A Generate Heist.** Sensors form a DAG; disabling one requires first disabling a dependent. Edges have risk scores (zeroed along a path after a target is taken). For each target, submit a root→target deactivation path with minimal risk (tie-break on smaller sensor ids). Score is the summed absolute difference from the oracle's optimal path lengths.

**Frontend — Selling stolen goods.** Build a marketplace UI against a paginated stolen-items API ([Figma](https://www.figma.com/design/osaxr6bgmqSEAaRXSpvw9E/Generate-Tech-Challenge-S26)). Gallery, detail pages, purchase modal (no payment backend).

## What stuck / what I'd change

OpenAPI codegen and a real Postgres harness (integration, fuzz, performance) were worth the setup cost. Frontend request logging went through a buffered-channel batch queue. Things I'd redo: rate limits keyed by user id (easy to spam with new accounts), clearer / less ambiguous specs, CSP-style concurrency instead of ad-hoc channels, and a read-only DB role for interviewer scripts instead of handing out superuser credentials.
